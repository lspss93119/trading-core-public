[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-core"
version = "0.1.0"
description = "Reusable cryptocurrency trading infrastructure."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ccxt = [
    "ccxt>=4.5.73,<5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: tests that require external services or integrations",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
